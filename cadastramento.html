<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./css/cadastro.css">
    <meta author="Victor Dias de Souza">
    <title>cadastro pet</title>

</head>

<body>
    <main id="container">
        <div id="cabeçalho">
            <h1 id="Título">
                Criar conta Pet
            </h1>
            <button class="btn-default">
                <a href="index.html"></a>
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </div>

        <form action="" id="form">
            <div id="input_container">
                <div class="input-box">
                    <label for="nome" class="form-label">
                        Primeiro nome
                    </label>
                    <div class="input-field">
                        <input type="text" name="nome" id="nome" class="form-control" placeholder="digite aqui...">
                        <i class="fa-solid fa-user"></i>

                    </div>
                </div>

                <div class="input-box">
                    <label for="sobrenome" class="form-label">
                        Sobrenome
                    </label>
                    <div class="input-field">
                        <input type="text" name="sobrenome" id="sobrenome" class="form-control"
                            placeholder="digite aqui...">
                        <i class="fa-solid fa-user"></i>

                    </div>
                </div>
                <div class="input-box">
                    <label for="Data de nascimento" class="form-label">
                        Data de nascimento
                    </label>
                    <div class="input-field">
                        <input type="date" name="Data de nascimento" id="Data de nascimento" class="form-control">
                    </div>
                </div>
                <div class="input-box">
                    <label for=" Email" class="form-label">
                        Email
                    </label>
                    <div class="input-field">
                        <input type=" email" name=" email" id="email" class="form-control"
                            placeholder="exemplo@gmail.com">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>
                <div class="input-box">
                    <label for="senha" class="form-label">

                        Senha
                    </label>
                    <div class="senha">
                        <input type="password" name="senha" id="senha" class="form-control"
                            placeholder="digite sua senha..." minlength="8">
                        <i class=""></i>

                    </div>
                </div>
                <div class="input-box">
                    <label for="confirmar_senha" class="form-label">
                        Confirmar senha
                    </label>
                    <div class="confirmar_senha">
                        <input type="password" name="confirmar_senha" id="confirmar_senha" class="form-control"
                            placeholder="">
                        <i class=""></i>
                    </div>
                </div>
                <div class="grid-container">
                    <div class="radio-container"></div>

                </div>
            </div>
            <button type="sumbit" class="btn-default">
                <i class="fa-solid fa-check"></i>
                Criar conta
            </button>
        </form>
    </main>

</body>

</html>
